# Gigabyte X870E AORUS XTREME AI TOP (ALC1220)
# Subsystem: 0x1458:0xa0d5
#
# Works on STOCK kernels — no kernel patch required.
# Uses firmware patch file to:
#   1. Route pin 0x1b to mixer 0x0d (DAC 0x03) for independent output
#   2. Disable auto-mute via hint (front HP won't silence rear line-out)
#
# Installation:
#   sudo cp gigabyte-x870e-alc1220.fw /lib/firmware/
#   sudo cp snd-hda-x870e.conf /etc/modprobe.d/
#   sudo rm -f /etc/modprobe.d/test-generic.conf  # remove test config
#   reboot
#
options snd-hda-intel patch=gigabyte-x870e-alc1220.fw
